{% load ui %}
{# D07 for a tema: «Gi nytt navn» (D08) and «Slett» (D09). next brings rename back to this page and tab. #}
{% url 'courses:rename_topic' topic.id as rename_url %}{% url 'courses:delete_topic' topic.id as delete_url %}
<a class="menu-item" href="{{ rename_url }}?next={{ request.get_full_path|urlencode }}" hx-get="{{ rename_url }}?next={{ request.get_full_path|urlencode }}" hx-target="#dialog" hx-swap="innerHTML">{% icon "pencil" %}Gi nytt navn</a>
<a class="menu-item menu-item--destructive" href="{{ delete_url }}?next={{ request.get_full_path|urlencode }}" hx-get="{{ delete_url }}?next={{ request.get_full_path|urlencode }}" hx-target="#dialog" hx-swap="innerHTML">{% icon "trash" %}Slett</a>
