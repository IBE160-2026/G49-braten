[project]
name = "ai-study-buddy"
version = "0.1.0"
description = "AI Study Buddy: turns a student's own course material into active self-testing."
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.8.0",
    "django==6.1.3",
    "django-htmx==1.29.0",
    "pydantic==2.14.3",
    "pypdf==7.0.1",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
# Browser tests (tests/browser) are opt-in: `uv run pytest -m browser` overrides the -m below.
addopts = "--disable-socket -m 'not browser'"
markers = [
    "browser: Playwright test against live_server; deselected by default, run with `-m browser`",
]

[dependency-groups]
dev = [
    "pytest-django==4.14.0",
    "playwright==1.65.2",
    "pytest-playwright==0.10.0",
    "pytest-socket==0.8.1",
]
