# Step 1: core loop, done and tested by 20 November 2026 (delivery-plan.md)
- id: "1"
  title: Project skeleton, environment settings and test harness
  description: >-
    Django project with the module layout, environment-driven settings that start in Mock mode on an empty .env, and the Key-free pytest setup with the import-graph test (SPEC.md Constraints; architecture AD-1, AD-12, AD-14, AD-15).
  spec_checkpoint: true
- id: "2"
  title: Accounts, sign-in and ownership
  description: >-
    Sign-up, sign-in and sign-out with email and password, password hashing, and per-Student data isolation answering 404 for anything not owned (CAP-1).
- id: "3"
  title: Courses, Topics and Sources with the shell and a basic Home
  description: >-
    Create, rename and delete Courses, Topics and Sources with confirmation and cascade, inside the app shell with a first Home listing Courses (CAP-2).
- id: "4"
  title: Upload and text extraction with Location
  description: >-
    Upload PDF, plain text or pasted text with a Detail level, enforce the upload limits, and store text per Location (CAP-3, FR-3, FR-4).
  spec_checkpoint: true
  invoke_dev_with: >-
    Settle architecture OQ-1 first: run the extraction test on three of the Author's own slide decks (pypdf plain and layout mode against pdfplumber), lock the library and MIN_TEXT_CHARS, and write the result to docs/quality/ before implementing.
- id: "5"
  title: AI gateway, Mock mode with the Sample document, and the daily limit
  description: >-
    The single AI port with the Mock adapter, the Sample document and its recordings, mode display, and the database-counted limit of 20 Generation calls a day (CAP-12, CAP-13 NFR-7).
  spec_checkpoint: true
  invoke_dev_with: >-
    Choose a copyright-free PDF of about 20 pages as the Sample document. The recordings must contain exactly one Generated item with a wrong page index so the real Reference check removes it.
- id: "6"
  title: Study-material generation and the Reference check
  description: >-
    Generate Summary, Key concepts, Flashcards and Questions in the Source's language through the all-or-nothing generation lifecycle with retry, and remove and count items that fail the Reference check (CAP-4, CAP-5, FR-6).
  spec_checkpoint: true
  invoke_dev_with: >-
    Keep the FR-3 limits as module constants. Real-mode generation time (architecture OQ-2, 20- and 50-page PDFs) is measured once story 10 lands; if it nears 150 s, lower the FR-3 limits.
- id: "7"
  title: Topic page with four tabs and item deletion
  description: >-
    Topic page with Summary, Quiz, Self-test and Sources areas, Source status in the Sources area, and deletion of single Generated items (CAP-6).
- id: "8"
  title: Practice-mode Quiz and grading
  description: >-
    Practice-mode Quiz with Hints on request, Multiple-choice grading in code, Free-text grading by the AI provider with not-graded retry, and the Student's Grade override (CAP-7).
  spec_checkpoint: true
- id: "9"
  title: Quiz result and Retry round
  description: >-
    Result with score and every Grade, and repeatable Retry rounds holding exactly the incorrect and partially correct Questions (CAP-8, FR-13).
- id: "10"
  title: Real mode, privacy notice and Key handling
  description: >-
    Anthropic adapter for Claude Haiku 5.5, the privacy notice enforced at the gateway, and named messages for a rejected Key or rate limit, with the Key never leaving the environment (CAP-13).
  done_checkpoint: true

